# cosmic-ray config — target: search/hybrid_searcher.py
# Run: uv run cosmic-ray init cr-hybrid-searcher.toml cr-hybrid-searcher.sqlite
#      uv run cosmic-ray baseline cr-hybrid-searcher.toml
#      uv run cosmic-ray exec cr-hybrid-searcher.toml cr-hybrid-searcher.sqlite
#      uv run cr-report cr-hybrid-searcher.sqlite
[cosmic-ray]
module-path = "search/hybrid_searcher.py"
timeout = 60.0
excluded-modules = []
test-command = ".venv/Scripts/python.exe -m pytest tests/unit/search/test_hybrid_search.py -q --no-header --tb=no"

[cosmic-ray.distributor]
name = "local"
