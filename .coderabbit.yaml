# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit: second-opinion PR reviewer next to claude-code-review.yml (replaces Charlie,
# shut down 2026-10). Free on this public repo. Rules below are ported from the old
# .charlie/instructions/code-style.md (bugs-relevant parts only).
language: en-US

reviews:
  # Bugs-only layer on top of /code-review: no walkthrough extras, only important findings.
  profile: quiet
  request_changes_workflow: false # comment only, never approve or block
  high_level_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  related_issues: false
  related_prs: false
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*" # PRs target development (see P2 below), not only main
  path_instructions:
    - path: "**"
      instructions: |
        Report bugs only: behaviour this PR breaks or makes reachable, such as wrong results,
        crashes, races, resource leaks, unhandled errors, index or cache corruption, and broken
        contracts or invariants. Each finding needs a reachable trigger and a concrete
        consequence. Do not comment on style, naming, docs, refactors, type hints, performance
        tuning, optional hardening, pre-existing problems, expected lockfile or generated-file
        changes, or anything the linters already report.

        Don't report as a bug: references to `scripts/git/`, `CLAUDE.md`, `MEMORY.md` or the
        other "Local-only content" entries in `.gitignore`. They are intentionally absent from
        the repository (maintainer-local), not missing files.

chat:
  auto_reply: true
