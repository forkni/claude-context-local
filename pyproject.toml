[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Legacy CUDA 12.4 index (fallback for older systems)
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
# CUDA 12.8 (recommended for RTX 50 series and newer GPUs)
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# Code quality tools configuration
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "_archive",
    "build",
    "dist",
    "__pycache__",
    "tests/test_data",  # Sample code for testing, not production code
    "*.cmd",  # Batch files
    "*.bat",  # Batch files
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (replaces standalone isort)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming (catches PascalCase functions, snake_case classes)
    "UP",  # pyupgrade (auto-fixes Optional->|None, Dict->dict)
    "SIM", # flake8-simplify (catches simplifiable patterns)
    "BLE", # flake8-blind-except - flags `except Exception`/bare `except:` without justification
]
ignore = [
    "C901",  # McCabe complexity - skip for faster checks (diffusers pattern)
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
# Imports inside try-except blocks cause conflicts between ruff and isort
"tests/integration/test_mcp_functionality.py" = ["I001"]
"tests/integration/test_token_efficiency_workflow.py" = ["I001"]
# Broad catch-alls are routine in tests/scripts/tools (fixtures, one-off tooling);
# BLE001 is enforced only on the core library.
"tests/**" = ["BLE001"]
"scripts/**" = ["BLE001"]
"tools/**" = ["BLE001"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["chunking", "embeddings", "mcp_server", "search", "merkle", "evaluation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyrefly]
project-includes = [
    "search/**/*.py",
    "mcp_server/**/*.py",
    "chunking/**/*.py",
    "graph/**/*.py",
    "embeddings/**/*.py",
    "merkle/**/*.py",
    "utils/**/*.py",
    "evaluation/**/*.py",
]
project-excludes = [
    "**/__pycache__",
    "**/.venv/**",
    "**/site-packages/**",
    "_archive/**",
    "tests/**",
    "scripts/**",
    "tools/**",
    ".claude/**",
    "profiler_logs/**",
    "logs/**",
]

python-version = "3.11"
python-platform = "win32"

check-unannotated-defs = true
infer-return-types = "checked"
preset = "default"
permissive-ignores = true

replace-imports-with-any = [
    "faiss",
    "torch", "torch.*",
    "transformers", "transformers.*",
    "sentence_transformers", "sentence_transformers.*",
    "tree_sitter", "tree_sitter.*",
    "tree_sitter_python", "tree_sitter_javascript", "tree_sitter_typescript",
    "tree_sitter_go", "tree_sitter_rust", "tree_sitter_c", "tree_sitter_cpp",
    "tree_sitter_c_sharp", "tree_sitter_glsl",
    "rank_bm25", "rank_bm25.*",
    "tiktoken",
    "networkx", "networkx.*",
    "snoop", "py_heat",
    "pyan", "pyan.*",
    "litellm", "litellm.*",
]

[[tool.pyrefly.sub-config]]
matches = "chunking/languages/**"
errors = { missing-attribute = "warn", missing-import = "warn", bad-argument-type = "warn" }

[[tool.pyrefly.sub-config]]
matches = "graph/relationship_extractors/**"
errors = { missing-attribute = "warn", bad-argument-type = "warn" }

[[tool.pyrefly.sub-config]]
matches = "mcp_server/tools/**"
errors = { missing-attribute = "warn", bad-argument-type = "warn" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

# ---------------------------------------------------------------------------
# Testing infrastructure
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--color=yes",
    "--durations=10",
    "--import-mode=importlib",  # pytest docs recommendation for new projects; avoids sys.path hacks
]
pythonpath = [".", "tools"]  # project root + tools/ (namespace package, scripts imported bare)
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "mcp: MCP server related tests",
    "embeddings: Embedding generation tests",
    "chunking: Code chunking tests",
    "search: Search functionality tests",
    "asyncio: Mark test as async (pytest-asyncio)",
    "gpu: Requires CUDA device (skipped when absent)",
    "e2e: Full end-to-end workflow",
    "allow_network: Opt out of the tests/conftest.py real-network guard",
]
filterwarnings = [
    # "error" must stay first: pytest registers ini filters top-to-bottom and
    # each registration is prepended, so entries listed *after* this one end
    # up checked *before* it (highest priority) -- making "error" the
    # catch-all fallback rather than a blanket suppressor. First-party
    # warnings raised anywhere in tests/unit now fail the test that raised
    # them; only these third-party module patterns are re-ignored.
    "error",
    # Escalating to "error" also turns ResourceWarning into a failure, but
    # pytest reports leaked-handle warnings via a separate GC-timing-dependent
    # path (_pytest.unraisableexception) that surfaces on whichever unrelated
    # test happens to be running when the interpreter reaps the leaked object,
    # not the test that actually leaked (see tests/TESTING_GUIDE.md "Phase
    # 10.7", which fixed the one confirmed leak -- unclosed LSP subprocess
    # pipes in chunking/relationships/lsp_call_graph.py -- and found no
    # evidence the second suspected site, chunking/languages/glsl.py:745, ever
    # existed in current source). Kept as defense-in-depth against a leak
    # elsewhere in the dependency tree, not because a known first-party leak
    # remains.
    "ignore::ResourceWarning",
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:transformers.*",
    "ignore::DeprecationWarning:huggingface_hub.*",
    "ignore:.*builtin type.*:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage (branch coverage on; run: pytest --cov --cov-branch --cov-report=term-missing)
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "chunking",
    "embeddings",
    "graph",
    "mcp_server",
    "merkle",
    "search",
    "tools",
    "utils",
    "evaluation",
]
# core = "sysmon"  # Uncomment for ~3x faster coverage on Python 3.12+

[tool.coverage.report]
show_missing = true
fail_under = 73  # Re-baselined 2026-08-04: 75.03% measured at 5762 passed, 1 skipped, 3
# pre-existing failures (unrelated to coverage scope, see tests/TESTING_GUIDE.md), CI-shaped
# suite (tests/ --ignore=tests/slow_integration, --extra test --extra callgraph --extra otel
# --extra gpu, branch coverage). Dropped from the prior 83.52%/fail_under=81 baseline because
# that measurement predates "tools" being added to source= above (Phase 11.3): 7 of the 9
# tools/ files are untested CLI/batch scripts at 0% coverage (~4.5k lines), honestly dragging
# the aggregate down now that they are actually counted instead of silently excluded. This is
# a coarse soft-floor tripwire; the real per-PR gate is Codecov's `patch` target in
# codecov.yml (blocking on changed-line coverage, not this whole-repo number) — codecov.yml
# also excludes tools/** from that gate, so this whole-repo floor is the only place tools/'s
# coverage is tracked at all.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
