# Pre-commit hooks configuration
# Installation: pip install pre-commit && pre-commit install

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(tests/test_data/|_archive/|search_config\.json$|results/)
      - id: trailing-whitespace
        exclude: ^(tests/test_data/|_archive/|search_config\.json$|results/)
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # Markdownlint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033]
        exclude: ^(CLAUDE\.md|MEMORY\.md|_archive/)

  # Local test-suite quality ratchets
  - repo: local
    hooks:
      - id: scan-test-smells
        name: test-smell ratchet
        entry: python scripts/scan_test_smells.py tests --baseline .smell-baseline.json
        language: system
        pass_filenames: false
        files: ^tests/.*\.py$

      - id: check-skipped-tests
        name: skipped-test drift check
        entry: python scripts/check_skipped_tests.py tests/
        language: system
        pass_filenames: false
        files: ^tests/.*\.py$

      - id: no-snapshot-update-in-addopts
        name: reject --snapshot-update in pytest addopts
        entry: '\-\-snapshot-update'
        language: pygrep
        files: ^(pyproject\.toml|pytest\.ini)$
