# cosmic-ray config — target: search/reranker.py
# Run: uv run cosmic-ray init cr-reranker.toml cr-reranker.sqlite
#      uv run cosmic-ray baseline cr-reranker.toml
#      uv run cosmic-ray exec cr-reranker.toml cr-reranker.sqlite
#      uv run cr-report cr-reranker.sqlite
[cosmic-ray]
module-path = "search/reranker.py"
timeout = 60.0
excluded-modules = []
# The interpreter path is quoted with backslashes on purpose: cosmic-ray passes
# shlex.split(test-command) to Popen, and Windows CreateProcess cannot start a
# relative path written with forward slashes (WinError 2). Every job then ends
# INCOMPETENT, which cr-rate counts as killed, so the gate passes with nothing tested.
test-command = '".venv\Scripts\python.exe" -m pytest tests/unit/search/test_reranker.py tests/unit/search/test_reranker_properties.py --hypothesis-profile=ci -q --no-header --tb=no'

[cosmic-ray.distributor]
name = "local"
