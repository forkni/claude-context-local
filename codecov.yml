coverage:
  status:
    # The real gate: changed-line coverage on the diff. A PR is blocked only
    # for coverage regressions it itself introduces, not pre-existing gaps.
    patch:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error

    # A true ratchet (auto-adjusts to current coverage +/- threshold), not a
    # hand-maintained floor — informational only, does not block merges.
    project:
      default:
        target: auto
        threshold: 0.5%
        informational: true

ignore:
  - "tests/**"
  - "scripts/**"
  - "tools/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
