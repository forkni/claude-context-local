name: Weekly

# Runs the tests/slow_integration/ tier (93 tests), which no other automated
# job executes — branch-protection.yml's PR gate --ignores it entirely and
# only --collect-only-checks it; nightly.yml also --ignores it. Real model
# downloads and GPU work make it too slow for per-PR or nightly cadence, but
# leaving it permanently unexecuted means those 93 tests offer zero actual
# regression protection (see tests/TESTING_GUIDE.md, Phase 11).
#
# schedule: only fires from the repo's default branch (main), so this job
# explicitly checks out development to actually test the branch that matters
# (same workaround nightly.yml documents and uses).

on:
  schedule:
    - cron: '0 9 * * 1'  # 09:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  slow-integration:
    name: Slow Integration Tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --extra test --extra callgraph --extra otel --extra gpu

      - name: Run slow-integration tests
        run: uv run pytest tests/slow_integration -v --tb=short --no-cov
