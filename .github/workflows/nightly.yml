name: Monthly deep CI

# Scheduled deep-CI workflow:
# 1. test-windows: Windows-native test execution against development branch.
# 2. lock-refresh-canary: Re-resolves full dependency graph (uv lock --upgrade)
#    and runs fast unit tests against it to detect upstream breakage before PRs fail.
# 3. security-audit: pip-audit vulnerability scan across resolved dependencies.
#
# schedule: only fires from the default branch (development); jobs still pin
# ref: development so a default-branch change cannot silently retarget them.
#
# Minutes budget: one scheduled run per month (file name kept as nightly.yml for
# history and doc links). Use workflow_dispatch for an on-demand run.

on:
  schedule:
    - cron: '0 7 1 * *'  # 07:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test-windows:
    name: Test Suite (Windows)
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --extra test --extra callgraph --extra otel --extra gpu

      - name: Run tests
        # Runs the suite on Windows. Tests outside slow_integration run here.
        run: uv run pytest tests/ --ignore=tests/slow_integration -m "not quarantine" -q --no-cov

  lock-refresh-canary:
    name: Lock-Refresh Canary (uv lock --upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Re-resolve dependency graph
        run: uv lock --upgrade

      - name: Install refreshed dependencies
        run: uv sync --extra test --extra callgraph --extra otel

      - name: Run test suite against refreshed graph
        run: uv run pytest tests/unit/ -m "not quarantine" -q --no-cov

  security-audit:
    name: Security Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies with dev extra
        run: uv sync --locked --extra dev

      - name: Run pip-audit
        # Ignore only upstream-unfixed CVEs documented in pyproject.toml ("Deferred (no upstream fix)")
        run: |
          uv run pip-audit \
            --ignore-vuln CVE-2024-35515 \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln CVE-2026-81726 \
            --ignore-vuln GHSA-8mgp-746c-j5xp \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln CVE-2026-5241 \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln CVE-2026-59890
