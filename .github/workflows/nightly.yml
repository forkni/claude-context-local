name: Nightly (scheduled deep CI)

# Scheduled deep-CI workflow:
# 1. test-windows: Windows-native test execution against development branch.
# 2. lock-refresh-canary: Re-resolves full dependency graph (uv lock --upgrade)
#    and runs fast unit tests against it to detect upstream breakage before PRs fail.
# 3. security-audit: pip-audit vulnerability scan across resolved dependencies.
#
# schedule: only fires from default branch (main), so jobs checkout development
# to test the active integration branch.

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-windows:
    name: Test Suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --extra test --extra callgraph --extra otel --extra gpu

      - name: Run tests
        # Runs the suite on Windows. Tests outside slow_integration run here.
        run: uv run pytest tests/ --ignore=tests/slow_integration -m "not quarantine" -q --no-cov

  lock-refresh-canary:
    name: Lock-Refresh Canary (uv lock --upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Re-resolve dependency graph
        run: uv lock --upgrade

      - name: Install refreshed dependencies
        run: uv sync --extra test --extra callgraph --extra otel

      - name: Run test suite against refreshed graph
        run: uv run pytest tests/unit/ -m "not quarantine" -q --no-cov

  security-audit:
    name: Security Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies with dev extra
        run: uv sync --locked --extra dev

      - name: Run pip-audit
        run: uv run pip-audit
