name: Nightly (scheduled deep CI)

# Scheduled deep-CI workflow:
# 1. test-windows: Windows-native test execution against development branch.
# 2. lock-refresh-canary: Re-resolves full dependency graph (uv lock --upgrade)
#    and runs fast unit tests against it to detect upstream breakage before PRs fail.
# 3. security-audit: pip-audit vulnerability scan across resolved dependencies.
#
# schedule: only fires from default branch (main), so jobs checkout development
# to test the active integration branch.
#
# Minutes budget: test-windows (~14 min on windows-2025) runs only when
# development received a commit in the last 25h (the changes gate). The two
# ubuntu jobs run every night: upstream releases and new advisories land
# whether or not development moved. workflow_dispatch always runs everything.

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Development changed in last 25h?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Count recent development commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=development&since=${since}&per_page=1" --jq 'length')
          echo "commits since ${since}: ${count}"
          if [ "$count" -gt 0 ]; then echo "changed=true"; else echo "changed=false"; fi >> "$GITHUB_OUTPUT"

  test-windows:
    name: Test Suite (Windows)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --extra test --extra callgraph --extra otel --extra gpu

      - name: Run tests
        # Runs the suite on Windows. Tests outside slow_integration run here.
        run: uv run pytest tests/ --ignore=tests/slow_integration -m "not quarantine" -q --no-cov

  lock-refresh-canary:
    name: Lock-Refresh Canary (uv lock --upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Re-resolve dependency graph
        run: uv lock --upgrade

      - name: Install refreshed dependencies
        run: uv sync --extra test --extra callgraph --extra otel

      - name: Run test suite against refreshed graph
        run: uv run pytest tests/unit/ -m "not quarantine" -q --no-cov

  security-audit:
    name: Security Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: development
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies with dev extra
        run: uv sync --locked --extra dev

      - name: Run pip-audit
        # Ignore only upstream-unfixed CVEs documented in pyproject.toml ("Deferred (no upstream fix)")
        run: |
          uv run pip-audit \
            --ignore-vuln CVE-2024-35515 \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln CVE-2026-81726 \
            --ignore-vuln GHSA-8mgp-746c-j5xp \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln CVE-2026-5241 \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln CVE-2026-59890
