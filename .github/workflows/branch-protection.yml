name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # pushes to development/main always get a verdict

jobs:
  validate:
    name: Validate Branch State
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0  # Full history for branch comparison
          persist-credentials: false

      - name: Check for CRLF in the index
        run: |
          # `* text=auto` (.gitattributes) keeps blobs LF; CRLF here means a client bypassed it.
          CRLF_FILES=$(git ls-files --eol | grep '^i/crlf' || true)
          if [ -n "$CRLF_FILES" ]; then
            echo "❌ ERROR: CRLF line endings committed:"
            echo "$CRLF_FILES"
            echo "Fix: git add --renormalize <files> && commit"
            exit 1
          fi
          echo "✅ No CRLF files in the index"

      - name: Check for local-only files
        run: |
          echo "Checking for accidentally committed local files..."

          # Check for prohibited files
          FOUND_ISSUES=0

          for file in CLAUDE.md MEMORY.md; do
            if git ls-files | grep -q "^$file$"; then
              echo "❌ ERROR: $file is tracked in git (should be local-only)"
              FOUND_ISSUES=1
            fi
          done

          # Check for prohibited directories
          for dir in _archive benchmark_results; do
            if git ls-files | grep -q "^$dir/"; then
              echo "❌ ERROR: $dir/ is tracked in git (should be local-only)"
              FOUND_ISSUES=1
            fi
          done

          if [ $FOUND_ISSUES -eq 0 ]; then
            echo "✅ No local-only files detected"
          else
            echo ""
            echo "Fix: Remove these files from git tracking"
            exit 1
          fi

      - name: Verify .gitattributes exists
        run: |
          if [ ! -f .gitattributes ]; then
            echo "❌ ERROR: .gitattributes not found"
            echo "This file is required for proper merge behavior"
            exit 1
          fi
          echo "✅ .gitattributes found"

      - name: Check for unauthorized docs
        run: |
          echo "Checking docs/ directory..."

          # Allowed public documentation files (main branch)
          ALLOWED_DOCS="ADVANCED_FEATURES_GUIDE.md|BENCHMARKS.md|CALL_GRAPH_TUNING.md|CLAUDE_DESKTOP_SETUP.md|CLAUDE_MD_TEMPLATE.md|claude_code_config.md|CODE_REVIEW_IMPROVEMENT_PLAN.md|DOCUMENTATION_INDEX.md|GIT_WORKFLOW.md|HYBRID_SEARCH_CONFIGURATION_GUIDE.md|INSTALLATION_GUIDE.md|MCP_TOOLS_REFERENCE.md|MODEL_MIGRATION_GUIDE.md|OBSERVABILITY.md|PYTORCH_COMPATIBILITY.md|VERSION_HISTORY.md"

          # Find unauthorized docs (only check on main branch)
          # docs/adr/ (architecture decision records) and docs/plans/ (implementation
          # plans, cited by ADRs and un-ignored in .gitignore) are always permitted
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            UNAUTHORIZED=$(git ls-files docs/ | grep -v -E "docs/($ALLOWED_DOCS)$" | grep -v -E "^docs/(adr|plans)/" || true)

            if [ -n "$UNAUTHORIZED" ]; then
              echo "❌ ERROR: Unauthorized documentation files found on main branch:"
              echo "$UNAUTHORIZED"
              echo ""
              echo "Allowed top-level docs:"
              echo "$ALLOWED_DOCS" | tr '|' '\n'
              echo "(docs/adr/ and docs/plans/ subtrees are always permitted)"
              exit 1
            fi
          fi

          echo "✅ Documentation validation passed"

  build:
    name: Build Wheel (Once)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Record build provenance and checksums
        run: |
          {
            echo "commit_sha=${{ github.sha }}"
            echo "workflow_run=${{ github.run_id }}"
            for f in dist/*; do
              sha256sum "$f"
            done
          } | tee dist/BUILD_INFO.txt

      - name: Upload built artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    name: Run Test Suite (Promoted Wheel)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_SYNC: "1"  # Core Rule 12: preserve promoted wheel installation

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true  # uploads uv store to GitHub Actions cache (10 GB free tier)

      - name: Download built wheel artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: dist
          path: dist/

      - name: Verify artifact integrity
        run: |
          grep -E '^[0-9a-f]{64}  ' dist/BUILD_INFO.txt > dist/BUILD_INFO.sha256
          sha256sum -c dist/BUILD_INFO.sha256

      - name: Install dependencies (without project)
        run: uv sync --locked --extra test --extra callgraph --extra otel --extra gpu --no-install-project

      - name: Install promoted wheel
        run: uv pip install --no-deps dist/*.whl

      - name: Smoke test (fail fast)
        # Verify promoted package imports from site-packages, not checkout, and fast smoke suite passes
        run: |
          uv run --no-sync python -P -c "import pathlib, mcp_server, search; p = pathlib.Path(search.__file__).resolve(); assert 'site-packages' in p.parts, f'Imported from checkout, not wheel: {p}'; print('Wheel import verified:', p)"
          uv run --no-sync pytest tests/ -m smoke -q --no-cov

      - name: Run tests with coverage
        run: |
          mkdir -p test-results
          uv run --no-sync pytest tests/ -v --tb=short --maxfail=20 -rs \
            --ignore=tests/slow_integration/ \
            -m "not slow and not quarantine" \
            -n auto --dist loadfile \
            --junitxml=test-results/junit.xml \
            --cov --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Slow-integration collection guard
        if: always()
        run: uv run --no-sync pytest tests/slow_integration --collect-only -q

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
        with:
          files: ./coverage.xml
          flags: unit
          name: ubuntu-py311
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra callgraph
        # dev → pyrefly, pre-commit; callgraph → libcst; base deps → numpy/mcp/etc. so
        # pyrefly resolves third-party imports (was: uvx isolated env → 50 false
        # missing-import errors). Torch wheels are heavy (~2.3 GB) but cached by setup-uv.

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run ruff check (linting + import sorting)
        id: ruff_check
        continue-on-error: true
        run: uv run ruff check --output-format=github .
        # Blocking gate — ruff is already enforced locally via commit_enhanced.sh

      - name: Check formatting (ruff format)
        id: ruff_format
        continue-on-error: true
        run: uv run ruff format --check .
        # Blocking gate — ruff format is already enforced locally

      - name: Run type checking (pyrefly)
        id: pyrefly
        continue-on-error: true
        run: uv run pyrefly check --baseline pyrefly-baseline.json --output-format=github
        # Blocking gate — exact-pinned pyrefly against versioned baseline

      - name: Check skipped/xfail test drift
        id: skip_drift
        continue-on-error: true
        run: uv run python scripts/check_skipped_tests.py tests/ --max-ratio 0.02
        # Blocking gate — Core Rule 11 ratchet against test suite skip rot

      - name: Check test smells ratchet
        id: test_smells
        continue-on-error: true
        run: uv run python scripts/scan_test_smells.py tests/ --baseline .smell-baseline.json
        # Blocking gate — Core Rule 11 ratchet against test smell growth

      - name: Run pre-commit hooks
        id: precommit
        continue-on-error: true
        run: uv run pre-commit run --all-files --show-diff-on-failure
        # Blocking gate — enforces markdownlint, file hygiene, ruff --fix
        # (ruff-pre-commit pinned to match uv.lock's ruff 0.16.9)
        # `uv run`, not `uvx`: pre-commit>=4.6.0 is already in the dev extra installed
        # above, so uvx would build a second, unpinned copy for no reason.
        # Deliberately overlaps the ruff steps above: .pre-commit-config.yaml pins
        # ruff to a fixed rev while `uv run ruff` uses uv.lock's resolution — running
        # both catches drift between the two pins.

      - name: Check spelling (typos)
        id: typos
        continue-on-error: true
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f  # v1.49.0
        with:
          files: docs/ README.md CHANGELOG.md

      # Workflow lint. actionlint reads .github/actionlint.yaml and shellchecks every `run:`
      # (shellcheck is preinstalled on ubuntu-latest). zizmor --offline keeps the gate
      # deterministic: its online audits query live advisories, so an unchanged tree could
      # turn red.
      - name: Lint workflows (actionlint)
        id: actionlint
        continue-on-error: true
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: Audit workflows (zizmor)
        id: zizmor
        continue-on-error: true
        run: uvx zizmor@1.31.1 --offline --format=github .github/workflows/

      - name: Aggregate lint results
        if: always()
        run: |
          fail=0
          for r in "ruff check:${{ steps.ruff_check.outcome }}" \
                   "ruff format:${{ steps.ruff_format.outcome }}" \
                   "pyrefly:${{ steps.pyrefly.outcome }}" \
                   "skipped tests:${{ steps.skip_drift.outcome }}" \
                   "test smells:${{ steps.test_smells.outcome }}" \
                   "pre-commit:${{ steps.precommit.outcome }}" \
                   "typos:${{ steps.typos.outcome }}" \
                   "actionlint:${{ steps.actionlint.outcome }}" \
                   "zizmor:${{ steps.zizmor.outcome }}"; do
            name="${r%%:*}"; out="${r##*:}"
            if [ "$out" != "success" ]; then echo "FAIL  $name"; fail=1; else echo "ok    $name"; fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::one or more lint sub-checks failed"; exit 1; }

  all-gates-green:
    name: All Gates Green
    runs-on: ubuntu-latest
    needs: [validate, build, test, lint]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check gate results
        run: |
          echo "validate: ${{ needs.validate.result }}"
          echo "build:    ${{ needs.build.result }}"
          echo "test:     ${{ needs.test.result }}"
          echo "lint:     ${{ needs.lint.result }}"
          if [ "${{ needs.validate.result }}" != "success" ] \
          || [ "${{ needs.build.result }}"    != "success" ] \
          || [ "${{ needs.test.result }}"     != "success" ] \
          || [ "${{ needs.lint.result }}"     != "success" ]; then
            echo "::error::One or more required gates did not succeed"
            exit 1
          fi
          echo "All gates green."
