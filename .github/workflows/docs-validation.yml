name: Documentation Validation

on:
  push:
    branches: [development, main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read

# markdown-lint and spelling jobs were removed 2026-08-03: markdownlint is fully
# redundant with .pre-commit-config.yaml's markdownlint-cli step, which runs inside
# branch-protection.yml's `lint` job (blocking, aggregated into All Gates Green) —
# two copies where one can never fail (continue-on-error: true, no paths filter to
# make it required) is worse than one that can. Spelling (crate-ci/typos) moved into
# that same `lint` job as an aggregated sub-check for the same reason: this file has
# `paths:` filters, so nothing here can ever become a required check without hanging
# every PR that doesn't touch docs/.

jobs:
  link-check:
    name: Link Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Check documentation links
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621  # v1.10.0
        with:
          args: |
            --verbose
            --no-progress
            --exclude-path _archive
            --exclude-path .venv
            --exclude-mail
            '**/*.md'
        continue-on-error: true
        # Deliberately non-blocking: link checking is network-dependent and
        # legitimately flaky (rate limits, transient DNS/host issues), unlike
        # markdown-lint/typos which were removed above rather than kept soft.
