name: Mutation Testing (Periodic)

# Periodic, out-of-band mutation testing workflow.
# Mutation runs are O(N mutants x suite time) — far too expensive for the commit-stage
# budget, so this workflow never runs on the PR path. It runs on workflow_dispatch
# (on demand, e.g. before releases or after major test refactors) and on a monthly schedule.
# The schedule uses up to 5 x 60 windows-2025 minutes, so it runs monthly, not weekly.
#
# Engine: cosmic-ray on windows-2025, matching the local developer environment and
# the committed cr-*.toml configs for zero-mock and de-mocked deterministic cores.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "cr-*.toml target to run (relative path, or 'all')"
        default: "all"
        type: choice
        options:
          - all
          - cr-metrics.toml
          - cr-reranker.toml
          - cr-call_edge.toml
          - cr-centrality_ranker.toml
          - cr-reranking_engine.toml
  schedule:
    - cron: "0 6 1 * *"   # 1st of each month 06:00 UTC (monthly)

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare Mutation Targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
      - name: Resolve matrix targets
        id: set-targets
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ]; then
            echo 'targets=["cr-metrics.toml", "cr-reranker.toml", "cr-call_edge.toml", "cr-centrality_ranker.toml", "cr-reranking_engine.toml"]' >> "$GITHUB_OUTPUT"
          else
            echo "targets=[\"$TARGET\"]" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: cosmic-ray (${{ matrix.target }})
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}  # via env, not inline ${{ }} in run: (template injection)
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies (from locked graph)
        run: uv sync --locked --extra test --extra dev --extra callgraph

      - name: Verify baseline (tests must pass on unmodified source)
        run: uv run cosmic-ray baseline "$TARGET"

      - name: Initialize session database
        run: uv run cosmic-ray init "$TARGET" "$TARGET.sqlite"

      - name: Filter pragma no-mutate lines
        run: uv run cr-filter-pragma "$TARGET.sqlite"

      - name: Execute mutations
        run: uv run cosmic-ray exec "$TARGET" "$TARGET.sqlite"

      - name: Report survivors
        run: uv run cr-report "$TARGET.sqlite"

      - name: Gate on survival rate
        run: uv run cr-rate --fail-over 25.0 "$TARGET.sqlite"

      - name: Upload mutation database artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: cosmic-ray-session-${{ matrix.target }}
          path: "*.sqlite"
          retention-days: 14
