version: 2
updates:
  # GitHub Actions — SHA-pinned refs (see .github/workflows/*.yml); dependabot
  # updates the pin + the trailing version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python deps — "uv" (not "pip") so uv.lock gets refreshed, not just pyproject.toml.
  #
  # Split into two entries because "target-branch" only applies to version updates:
  # security updates are always raised by GitHub against the default branch and
  # ignore "target-branch" entirely. Verified 2026-08-04: security job definitions
  # carry "security-updates-only":true AND "ignore-conditions":[] — the "ignore:"
  # ceilings below are NOT honoured for security PRs (confirmed both with and
  # without this file present on main). They only govern the version-update entry
  # below. This entry's own "ignore:" block is kept for documentation/consistency,
  # not because it has any effect on what lands here.

  # Security updates — no target-branch, so GitHub forces these onto the default
  # branch (main) regardless. "ignore:" below has no effect on these jobs — see
  # the note above.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-tooling:
        patterns:
          - "ruff"
          - "pyrefly"
          - "pre-commit"
          - "pytest*"
          - "mutmut"
          - "cosmic-ray"
    ignore:
      # Deliberate ceilings recorded in pyproject.toml — see the inline comments
      # there for the specific incompatibility/CVE each one is pinned against.
      - dependency-name: "torch"
        versions: [">=2.9.0"]
      - dependency-name: "tree-sitter"
        versions: [">=0.26"]
      - dependency-name: "transformers"
        versions: [">=6"]

  # Version updates — routed to development so routine bumps go through CI/review
  # before reaching main, instead of landing directly on the default branch.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      dev-tooling:
        patterns:
          - "ruff"
          - "pyrefly"
          - "pre-commit"
          - "pytest*"
          - "mutmut"
          - "cosmic-ray"
    ignore:
      - dependency-name: "torch"
        versions: [">=2.9.0"]
      - dependency-name: "tree-sitter"
        versions: [">=0.26"]
      - dependency-name: "transformers"
        versions: [">=6"]
