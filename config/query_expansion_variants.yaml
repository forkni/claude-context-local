# Curated Query-Expansion Vocabulary
#
# Maps general software-engineering concepts to code-domain expansion terms.
# When a query's lowercased text contains one of a concept's triggers, the
# concept's terms are appended to an extra (discounted) BM25 fusion leg —
# bridging plain-English paraphrases ("survive a restart") to the identifiers
# code actually uses ("save", "persist", "disk").
#
# Curation policy (enforced at review time, not runtime):
# - GENERALITY TEST: every concept must plausibly serve queries outside any
#   benchmark set. Concepts and triggers describe universal software ideas
#   (persistence, eviction, pooling, ...), never a specific query's wording.
# - NEVER QUERY-KEYED: no entry may be named after, or triggered solely by,
#   a golden-dataset query. Triggers are common colloquialisms for the concept.
# - CAP: ~15 concepts maximum. Growth pressure means the approach is wrong
#   (switch to embedding-based matching instead of adding entries).
# - Matching is deterministic lowercase substring containment (see
#   search/query_expansion.py). Multi-word triggers must therefore appear
#   verbatim in the query; prefer 1-2 word triggers unless a phrase is
#   needed to avoid over-firing (e.g. "memory gets tight", not "memory").
#
# Schema: concepts.<name>.triggers = list[str] (lowercase, substring-matched)
#         concepts.<name>.terms    = list[str] (appended to the variant leg)
#
# Last updated: 2026-07-28 (initial table, 12 concepts)

concepts:
